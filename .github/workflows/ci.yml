name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A green `make ci` locally predicts a green pipeline: CI runs the exact same
  # sequence (lint -> coverage -> e2e), preceded by the tooling self-tests.
  ci:
    name: make ci (lint, coverage, e2e)
    runs-on: macos-15
    # A ceiling, not the normal stop (about 15 min): scripts/watchdog.sh stops a
    # hung Swift run after 15 min (issue 200); this ends anything else that
    # hangs before GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Trivy
        run: brew install trivy

      # The rustc version is part of the key: a build cached by an older
      # toolchain carries instrumented binaries and profiles in an older LLVM
      # format that the new llvm-profdata cannot merge.
      - name: Rust version for the cache key
        id: rustc
        run: echo "version=$(rustc -V | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Cache cargo & SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            app/.build
          key: ${{ runner.os }}-ci-rustc${{ steps.rustc.outputs.version }}-${{ hashFiles('**/Cargo.lock', 'app/Package.swift') }}
          restore-keys: ${{ runner.os }}-ci-rustc${{ steps.rustc.outputs.version }}-

      - name: Tooling self-tests
        run: |
          bash tests/gate_test.sh
          bash tests/swift_gate_test.sh
          bash tests/ffi_test.sh
          bash tests/fixtures_test.sh
          bash tests/make_test.sh
          bash tests/branch_protection_test.sh
          bash tests/security_test.sh
          bash tests/legal_gate_test.sh
          bash tests/release_test.sh
          bash tests/crash_reports_test.sh
          bash tests/watchdog_test.sh

      # Legal gate (issue 6.1): a device-area PR (M6, 6.2–6.7) cannot merge
      # without a recorded `needs-legal-review` sign-off + a link to ADR 0006 in
      # its body, and no forbidden AiM artifact (*.fw/*.dll/*.ipa) may be
      # committed. Non-device PRs are detected as out-of-scope and pass.
      - name: Legal gate (device-area PRs)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check_legal_gate.sh --ci

      # Scan the source tree for known-vulnerable deps, secrets, and IaC
      # misconfigurations before the long build. Same command as `make security`
      # run locally, so a green local scan predicts a green CI scan.
      - name: Security scan (Trivy)
        run: make security

      # Fetch the git-ignored .xrk samples so the decode oracle tests and the
      # corpus conformance harness run against real data (they skip gracefully
      # when absent). Goldens stay committed, so --no-goldens keeps this fast and
      # libxrk-free.
      - name: Fetch .xrk fixtures
        run: bash scripts/fetch_fixtures.sh --no-goldens

      # `make ci` runs lint -> coverage -> e2e. The e2e phase (scripts/e2e.sh)
      # runs the corpus golden conformance harness (issue 1.8): it decodes every
      # fixtures/*.xrk with decode_session and asserts channels/gps/laps/metadata
      # match fixtures/golden/*.json within docs/DECODE_TOLERANCES.md, exiting
      # non-zero on any mismatch — the milestone's corpus-wide regression gate.
      - name: make ci
        run: make ci
        env:
          COVERAGE_THRESHOLD: "95"
          # The overlay snapshot tests (issue 9.11) write every render here, and
          # a diff image for any golden mismatch, for the upload step below.
          OVERLAY_SNAPSHOT_ARTIFACTS: ${{ runner.temp }}/overlay-snapshots

      # The runner's own overlay renders (and diffs, on a mismatch), so a golden
      # this runner rasterises differently can be inspected — and, if need be,
      # re-recorded from these files (fixtures/overlay/golden/).
      - name: Upload overlay snapshot renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-snapshots
          path: ${{ runner.temp }}/overlay-snapshots
          if-no-files-found: ignore
          retention-days: 14

      # Large-session performance guard (issue 7.2): run the Criterion benches and
      # fail if any tracked benchmark blows past its wall-clock ceiling in
      # scripts/bench_thresholds.json — a machine-tolerant algorithmic-regression
      # gate (catches O(n^2) blow-ups, not micro-noise). Kept as a step of this job
      # (not a separate job) so the required status-check contexts still match the
      # CI job names — see tests/branch_protection_test.sh.
      - name: Benchmark regression ceilings (issue 7.2)
        run: bash scripts/bench.sh --ci

      # A test process that crashes leaves only "Exited with unexpected signal
      # code 11" in the log (issue 200). Its crash report names the faulting
      # thread and frames: print them here and keep the reports, one artifact
      # per attempt so a re-run's reports never collide with the first's.
      - name: Collect crash reports
        if: failure() || cancelled()
        run: bash scripts/collect_crash_reports.sh "${{ runner.temp }}/crash-reports"

      - name: Upload crash reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore
          retention-days: 14
