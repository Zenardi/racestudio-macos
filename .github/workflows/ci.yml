name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust gate (fmt · clippy · test · coverage ≥95%)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust coverage-gate self-tests
        run: bash tests/gate_test.sh

      - name: Run Rust quality + coverage gate
        run: bash scripts/coverage.sh --rust-only
        env:
          COVERAGE_THRESHOLD: "95"

  swift:
    name: Swift gate (swiftlint · swift test · coverage ≥95% on RaceStudioCore)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: app/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('app/Package.swift') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Run Swift coverage-gate self-tests
        run: bash tests/swift_gate_test.sh

      - name: Run Swift quality + coverage gate
        run: bash scripts/coverage.sh --swift-only
        env:
          COVERAGE_THRESHOLD: "95"
