name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A green `make ci` locally predicts a green pipeline: CI runs the exact same
  # sequence (lint -> coverage -> e2e), preceded by the tooling self-tests.
  ci:
    name: make ci (lint, coverage, e2e)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy, rustfmt
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Install Trivy
        run: brew install trivy

      - name: Cache cargo & SwiftPM build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            app/.build
          key: ${{ runner.os }}-ci-${{ hashFiles('**/Cargo.lock', 'app/Package.swift') }}
          restore-keys: ${{ runner.os }}-ci-

      - name: Tooling self-tests
        run: |
          bash tests/gate_test.sh
          bash tests/swift_gate_test.sh
          bash tests/ffi_test.sh
          bash tests/fixtures_test.sh
          bash tests/make_test.sh
          bash tests/branch_protection_test.sh
          bash tests/security_test.sh
          bash tests/legal_gate_test.sh

      # Legal gate (issue 6.1): a device-area PR (M6, 6.2–6.7) cannot merge
      # without a recorded `needs-legal-review` sign-off + a link to ADR 0006 in
      # its body, and no forbidden AiM artifact (*.fw/*.dll/*.ipa) may be
      # committed. Non-device PRs are detected as out-of-scope and pass.
      - name: Legal gate (device-area PRs)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check_legal_gate.sh --ci

      # Scan the source tree for known-vulnerable deps, secrets, and IaC
      # misconfigurations before the long build. Same command as `make security`
      # run locally, so a green local scan predicts a green CI scan.
      - name: Security scan (Trivy)
        run: make security

      # Fetch the git-ignored .xrk samples so the decode oracle tests and the
      # corpus conformance harness run against real data (they skip gracefully
      # when absent). Goldens stay committed, so --no-goldens keeps this fast and
      # libxrk-free.
      - name: Fetch .xrk fixtures
        run: bash scripts/fetch_fixtures.sh --no-goldens

      # `make ci` runs lint -> coverage -> e2e. The e2e phase (scripts/e2e.sh)
      # runs the corpus golden conformance harness (issue 1.8): it decodes every
      # fixtures/*.xrk with decode_session and asserts channels/gps/laps/metadata
      # match fixtures/golden/*.json within docs/DECODE_TOLERANCES.md, exiting
      # non-zero on any mismatch — the milestone's corpus-wide regression gate.
      - name: make ci
        run: make ci
        env:
          COVERAGE_THRESHOLD: "95"
