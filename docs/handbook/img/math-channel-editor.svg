<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Math channel editor: an expression field with a live diagnostic caret and an embedded preview plot of the derived channel.">
  <style>
    .panel{fill:#f4f7fc;stroke:#3b6bd6;stroke-width:1.5}
    .field{fill:#ffffff;stroke:#9bb0d4;stroke-width:1.5}
    .t{font:13px -apple-system,Segoe UI,sans-serif;fill:#12233f}
    .mono{font:13px ui-monospace,Menlo,monospace;fill:#12233f}
    .ok{font:12px -apple-system,Segoe UI,sans-serif;fill:#2e7d32}
    .lbl{font:12px -apple-system,Segoe UI,sans-serif;fill:#5a6b85}
  </style>
  <text class="lbl" x="20" y="26">Math channel editor — live-validated expression + preview (schematic)</text>
  <rect class="panel" x="20" y="42" width="720" height="196" rx="6"/>
  <text class="t" x="36" y="70">Name</text><rect class="field" x="100" y="54" width="200" height="26" rx="4"/><text class="mono" x="110" y="72">CombinedG</text>
  <text class="t" x="36" y="112">Expression</text><rect class="field" x="100" y="96" width="500" height="26" rx="4"/>
  <text class="mono" x="110" y="114">sqrt(Ax*Ax + Ay*Ay)</text>
  <text class="ok" x="110" y="142">valid — updates as you type</text>
  <rect class="field" x="100" y="156" width="500" height="64" rx="4"/><text class="lbl" x="112" y="176">preview plot of the derived channel</text>
  <polyline points="112,214 180,196 250,206 330,180 420,200 500,184 590,208" fill="none" stroke="#3b6bd6" stroke-width="2"/>
</svg>
