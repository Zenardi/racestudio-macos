# SwiftLint configuration for the RaceStudio SwiftUI app.
# Enforced by the Swift coverage gate (scripts/coverage.sh --swift-lint) and CI.

included:
  - Sources
  - Tests

excluded:
  - .build
  - Generated

opt_in_rules:
  - empty_count
  - closure_spacing

line_length:
  warning: 120
  error: 200

identifier_name:
  min_length: 1 # allow short SwiftUI/local identifiers
