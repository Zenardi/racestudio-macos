[package]
name = "racestudio-decode"
description = "Clean-room decoder for AiM RaceStudio telemetry (.xrk) files."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dev-dependencies]
# Used only by the golden-fixture test harness (issue 0.5); not shipped.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Benchmark harness for the lazy-open / decode benches (issue 7.2). Only
# `cargo_bench_support` is needed to run `cargo bench`; plotting/rayon are off to
# keep the dev-dependency graph small.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "lazy_open"
harness = false

[lints.clippy]
all = "warn"
