[package]
name = "racestudio-device"
description = "Clean-room observation of the MyChron5/6 WiFi download protocol (issue 6.2): STCP framing, checksum, discovery, and transfer chunking. No networking client lands here — that is 6.3–6.6."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Sessions are stored zlib-compressed on the device (`.xrz`); issue #133's capture
# established this. Pure-Rust backend (miniz_oxide) so the xcframework build needs
# no C toolchain.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
# Used only by the protocol-notes test harness to read fixtures/device/manifest.json
# and verify recorded checksums/hashes; not shipped.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Used only by the 6.5 transfer test to decode a reassembled download and assert
# it against the M1 golden (proving the download is a valid, decodable .xrk).
racestudio-decode = { path = "../racestudio-decode" }
# Used only to build a decompression-bomb payload for the inflate guard's test.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints.clippy]
all = "warn"
