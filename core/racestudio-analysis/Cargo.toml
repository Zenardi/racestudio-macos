[package]
name = "racestudio-analysis"
description = "Telemetry analysis engine (channels, math, resampling) for RaceStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The analysis engine operates on the decoded, immutable `Session` model (1.6).
racestudio-decode = { path = "../racestudio-decode" }
# Mixed-radix FFT for the windowed spectrum (issue 3.7); handles any length.
rustfft = "6"

[dev-dependencies]
# Used only by the golden-fixture test harness (issue 0.5); not shipped.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Benchmark harness for the large-session performance benches (issue 7.2). Only
# `cargo_bench_support` is needed to run `cargo bench`; plotting/rayon are off to
# keep the dev-dependency graph small.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "decimation"
harness = false

[lints.clippy]
all = "warn"
