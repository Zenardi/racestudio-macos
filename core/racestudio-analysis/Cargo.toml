[package]
name = "racestudio-analysis"
description = "Telemetry analysis engine (channels, math, resampling) for RaceStudio."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# The analysis engine operates on the decoded, immutable `Session` model (1.6).
racestudio-decode = { path = "../racestudio-decode" }

[dev-dependencies]
# Property tests over the large resampling input space (issue 3.3); not shipped.
proptest = "1.8.0"
# Used only by the golden-fixture test harness (issue 0.5); not shipped.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.clippy]
all = "warn"
