[package]
name = "racestudio-ffi"
description = "UniFFI boundary exposing the RaceStudio Rust core to SwiftUI."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# staticlib: linked into the Swift xcframework; cdylib: read by uniffi-bindgen
# for metadata; lib: the Rust rlib used by unit tests.
crate-type = ["staticlib", "cdylib", "lib"]

[features]
# Pulls in the bundled uniffi-bindgen CLI. Kept off by default so the shipped
# static library does not carry the bindgen dependencies (clap, askama, …).
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[dependencies]
uniffi = { version = "0.28" }
racestudio-decode = { path = "../racestudio-decode" }
# Analysis engine (M3): laps, delta-t, statistics, math channels, FFT (issue 3.8).
racestudio-analysis = { path = "../racestudio-analysis" }

# No [dev-dependencies]: the crate has `staticlib`/`cdylib` crate-types, and
# adding any dev-dep makes cargo-llvm-cov instrument an extra, uncovered copy of
# the lib (~7% phantom coverage drop) — the same instrumentation interaction that
# bit issue 3.3. The one JSON golden the tests read is parsed by hand instead.

[lints.clippy]
all = "warn"
